<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere - Modern E-Commerce Application</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useContext, useReducer, createContext } = React;

    // --- 1. GLOBAL CONTEXT & REDUCER (Cart Management) ---
    const CartContext = createContext();

    const cartReducer = (state, action) => {
      switch (action.type) {
        case 'ADD_TO_CART': {
          const existingIndex = state.items.findIndex(item => item.id === action.payload.id);
          if (existingIndex > -1) {
            const updatedItems = [...state.items];
            updatedItems[existingIndex].quantity += 1;
            return { ...state, items: updatedItems };
          }
          return { ...state, items: [...state.items, { ...action.payload, quantity: 1 }] };
        }
        case 'REMOVE_FROM_CART':
          return { ...state, items: state.items.filter(item => item.id !== action.payload) };
        case 'UPDATE_QUANTITY':
          return {
            ...state,
            items: state.items.map(item => 
              item.id === action.payload.id ? { ...item, quantity: action.payload.quantity } : item
            )
          };
        case 'CLEAR_CART':
          return { ...state, items: [] };
        default:
          return state;
      }
    };

    // --- 2. CUSTOM HOOK (API Integration & Search State) ---
    const useFetchProducts = () => {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('https://fakestoreapi.com/products')
          .then(res => {
            if (!res.ok) throw new Error('Network error fetching products');
            return res.json();
          })
          .then(data => {
            setProducts(data);
            setLoading(false);
          })
          .catch(err => {
            setError(err.message);
            setLoading(false);
          });
      }, []);

      return { products, setProducts, loading, error };
    };

    // --- 3. COMPONENTS ---

    // Navbar Component
    const Navbar = ({ currentPath, navigate, cartCount }) => {
      const navLinks = [
        { name: 'Home', path: '/' },
        { name: 'Products', path: '/products' },
        { name: 'Dashboard (CRUD)', path: '/admin' },
        { name: 'Contact', path: '/contact' },
        { name: 'Profile', path: '/profile' }
      ];

      return (
        <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
              <div class="flex items-center space-x-3 cursor-pointer" onClick={() => navigate('/')}>
                <div class="bg-white text-indigo-700 p-2 rounded-lg font-black text-xl shadow">SS</div>
                <span class="font-bold text-xl tracking-tight">ShopSphere</span>
              </div>
              <div class="hidden md:flex space-x-1">
                {navLinks.map(link => (
                  <button
                    key={link.path}
                    onClick={() => navigate(link.path)}
                    class={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${
                      currentPath === link.path ? 'bg-indigo-900 text-white shadow-inner' : 'hover:bg-indigo-600'
                    }`}
                  >
                    {link.name}
                  </button>
                ))}
              </div>
              <div class="flex items-center space-x-4">
                <button 
                  onClick={() => navigate('/cart')}
                  class="relative p-2 rounded-full hover:bg-indigo-600 transition"
                >
                  <span class="text-xl">🛒</span>
                  {cartCount > 0 && (
                    <span class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center animate-bounce">
                      {cartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </div>
        </nav>
      );
    };

    // Home Page
    const HomePage = ({ navigate }) => (
      <div class="space-y-12">
        <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-8 md:p-16 text-white shadow-xl text-center space-y-6">
          <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">Welcome to ShopSphere</h1>
          <p class="text-indigo-100 text-lg md:text-xl max-w-2xl mx-auto">
            Discover a wide range of curated products at unbeatable prices. Built with dynamic React components and state management.
          </p>
          <div class="pt-4">
            <button 
              onClick={() => navigate('/products')}
              class="bg-white text-indigo-600 font-bold px-8 py-4 rounded-xl shadow-lg hover:bg-indigo-50 transition transform hover:-translate-y-1"
            >
              Explore Products Catalog
            </button>
          </div>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
          <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 space-y-3">
            <div class="text-3xl">🚀</div>
            <h3 class="text-xl font-bold">Fast Delivery</h3>
            <p class="text-slate-600">Enjoy swift delivery on all orders with real-time tracking.</p>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 space-y-3">
            <div class="text-3xl">🛡️</div>
            <h3 class="text-xl font-bold">Secure Payments</h3>
            <p class="text-slate-600">Encrypted transactions guaranteeing top-notch security.</p>
          </div>
          <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 space-y-3">
            <div class="text-3xl">⭐</div>
            <h3 class="text-xl font-bold">Top Quality</h3>
            <p class="text-slate-600">Verified products sourced directly from trusted manufacturers.</p>
          </div>
        </div>
      </div>
    );

    // Nested Routing Pages for Products (Electronics, Men, Women, All)
    const ProductsPage = ({ products, loading, error, addToCart, selectedCategory, setSelectedCategory }) => {
      const searchInputRef = useRef();
      const [searchTerm, setSearchTerm] = useState('');

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        setSearchTerm(searchInputRef.current.value);
      };

      const categories = ['all', "electronics", "jewelery", "men's clothing", "women's clothing"];

      const filteredProducts = products.filter(product => {
        const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
        const matchesSearch = product.title.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (loading) return <div class="text-center py-20 text-indigo-600 font-bold text-xl">Loading products catalog...</div>;
      if (error) return <div class="text-center py-20 text-rose-600 font-bold">Error: {error}</div>;

      return (
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h2 class="text-2xl font-bold">Products Collection</h2>
              <p class="text-slate-500 text-sm">Use search or categories to filter products.</p>
            </div>
            
            {/* Search Form using useRef */}
            <form onSubmit={handleSearchSubmit} class="flex gap-2">
              <input 
                ref={searchInputRef}
                type="text" 
                placeholder="Search products..." 
                class="px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-medium hover:bg-indigo-700">
                Search
              </button>
            </form>
          </div>

          {/* Nested Navigation / Category Filter Tabs */}
          <div class="flex flex-wrap gap-2 border-b border-slate-200 pb-4">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}
                class={`px-4 py-2 rounded-xl capitalize font-medium text-sm transition ${
                  selectedCategory === cat ? 'bg-indigo-600 text-white shadow' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Product Cards Grid */}
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {filteredProducts.map(product => (
              <div key={product.id} class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col justify-between hover:shadow-lg transition">
                <div class="space-y-3">
                  <div class="h-48 w-full flex items-center justify-center p-4 bg-slate-50 rounded-xl">
                    <img src={product.image} alt={product.title} class="max-h-full max-w-full object-contain" />
                  </div>
                  <span class="text-xs uppercase tracking-wider font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md inline-block">
                    {product.category}
                  </span>
                  <h3 class="font-semibold text-slate-800 line-clamp-2">{product.title}</h3>
                </div>
                <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                  <span class="text-xl font-bold text-slate-900">${product.price}</span>
                  <button 
                    onClick={() => addToCart(product)}
                    class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl hover:bg-indigo-700 transition"
                  >
                    Add to Cart
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // Admin Dashboard (CRUD Operations)
    const AdminDashboard = ({ products, setProducts }) => {
      const [formData, setFormData] = useState({ id: null, title: '', price: '', category: 'electronics' });
      const [isEditing, setIsEditing] = useState(false);

      const handleInputChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.price) return;

        if (isEditing) {
          // UPDATE
          setProducts(products.map(p => p.id === formData.id ? { ...p, title: formData.title, price: parseFloat(formData.price), category: formData.category } : p));
          setIsEditing(false);
        } else {
          // CREATE
          const newProduct = {
            id: Date.now(),
            title: formData.title,
            price: parseFloat(formData.price),
            category: formData.category,
            image: 'https://via.placeholder.com/150'
          };
          setProducts([newProduct, ...products]);
        }
        setFormData({ id: null, title: '', price: '', category: 'electronics' });
      };

      const handleEdit = (product) => {
        setIsEditing(true);
        setFormData({ id: product.id, title: product.title, price: product.price, category: product.category });
      };

      const handleDelete = (id) => {
        // DELETE
        setProducts(products.filter(p => p.id !== id));
      };

      return (
        <div class="grid md:grid-cols-3 gap-8">
          {/* Form Side */}
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit space-y-4">
            <h2 class="text-xl font-bold">{isEditing ? 'Edit Product' : 'Add New Product'}</h2>
            <form onSubmit={handleSubmit} class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Product Title</label>
                <input 
                  type="text" 
                  name="title" 
                  value={formData.title} 
                  onChange={handleInputChange} 
                  required
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Price ($)</label>
                <input 
                  type="number" 
                  name="price" 
                  step="0.01" 
                  value={formData.price} 
                  onChange={handleInputChange} 
                  required
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                <select 
                  name="category" 
                  value={formData.category} 
                  onChange={handleInputChange} 
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                >
                  <option value="electronics">Electronics</option>
                  <option value="jewelery">Jewelery</option>
                  <option value="men's clothing">Men's Clothing</option>
                  <option value="women's clothing">Women's Clothing</option>
                </select>
              </div>
              <button 
                type="submit" 
                class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl hover:bg-indigo-700 transition"
              >
                {isEditing ? 'Update Product' : 'Create Product'}
              </button>
            </form>
          </div>

          {/* List/Table Side */}
          <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-xl font-bold">Manage Products (CRUD Inventory)</h2>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 text-slate-500 text-sm">
                    <th class="py-3 px-2">Title</th>
                    <th class="py-3 px-2">Category</th>
                    <th class="py-3 px-2">Price</th>
                    <th class="py-3 px-2 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  {products.slice(0, 8).map(product => (
                    <tr key={product.id}>
                      <td class="py-3 px-2 font-medium text-slate-800 line-clamp-1">{product.title}</td>
                      <td class="py-3 px-2 capitalize text-slate-500">{product.category}</td>
                      <td class="py-3 px-2 font-bold">${product.price}</td>
                      <td class="py-3 px-2 text-right space-x-2">
                        <button onClick={() => handleEdit(product)} class="text-indigo-600 font-semibold hover:underline">Edit</button>
                        <button onClick={() => handleDelete(product.id)} class="text-rose-600 font-semibold hover:underline">Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // Contact Form Component (Form Validation)
    const ContactPage = () => {
      const [form, setForm] = useState({ name: '', email: '', message: '' });
      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const validate = () => {
        let errs = {};
        if (!form.name.trim()) errs.name = 'Name is required';
        if (!form.email.trim()) errs.email = 'Email is required';
        else if (!/\S+@\S+\.\S+/.test(form.email)) errs.email = 'Email is invalid';
        if (!form.message.trim()) errs.message = 'Message cannot be empty';
        return errs;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate();
        if (Object.keys(validationErrors).length === 0) {
          setSubmitted(true);
          setErrors({});
        } else {
          setErrors(validationErrors);
        }
      };

      return (
        <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-100 space-y-6">
          <h2 class="text-2xl font-bold">Contact Support</h2>
          {submitted ? (
            <div class="p-4 bg-emerald-50 text-emerald-700 rounded-xl font-medium">
              Thank you for reaching out! We have received your message.
            </div>
          ) : (
            <form onSubmit={handleSubmit} class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input 
                  type="text" 
                  value={form.name} 
                  onChange={e => setForm({ ...form, name: e.target.value })}
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
                {errors.name && <p class="text-rose-500 text-xs mt-1">{errors.name}</p>}
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                <input 
                  type="email" 
                  value={form.email} 
                  onChange={e => setForm({ ...form, email: e.target.value })}
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                />
                {errors.email && <p class="text-rose-500 text-xs mt-1">{errors.email}</p>}
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
                <textarea 
                  rows="4" 
                  value={form.message} 
                  onChange={e => setForm({ ...form, message: e.target.value })}
                  class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                ></textarea>
                {errors.message && <p class="text-rose-500 text-xs mt-1">{errors.message}</p>}
              </div>
              <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                Send Message
              </button>
            </form>
          )}
        </div>
      );
    };

    // User Profile Page
    const ProfilePage = () => (
      <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-100 text-center space-y-4">
        <div class="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-bold mx-auto">
          JD
        </div>
        <div>
          <h2 class="text-xl font-bold">John Doe</h2>
          <p class="text-slate-500 text-sm">React Student & Developer</p>
        </div>
        <div class="pt-4 border-t border-slate-100 space-y-2 text-left text-sm text-slate-600">
          <p><strong>Email:</strong> john.doe@example.com</p>
          <p><strong>Role:</strong> Training Final Project Submission</p>
          <p><strong>Status:</strong> Active</p>
        </div>
      </div>
    );

    // Shopping Cart Page
    const CartPage = ({ cart, dispatch, navigate }) => {
      const total = cart.items.reduce((sum, item) => sum + item.price * item.quantity, 0);

      if (cart.items.length === 0) {
        return (
          <div class="text-center py-20 space-y-4">
            <h2 class="text-2xl font-bold text-slate-700">Your Cart is Empty</h2>
            <button onClick={() => navigate('/products')} class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium">
              Browse Products
            </button>
          </div>
        );
      }

      return (
        <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
          <h2 class="text-2xl font-bold">Your Shopping Cart</h2>
          <div class="divide-y divide-slate-100">
            {cart.items.map(item => (
              <div key={item.id} class="py-4 flex items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                  <img src={item.image} alt={item.title} class="w-16 h-16 object-contain" />
                  <div>
                    <h4 class="font-semibold text-slate-800">{item.title}</h4>
                    <p class="text-slate-500 text-sm">${item.price}</p>
                  </div>
                </div>
                <div class="flex items-center gap-4">
                  <span class="font-bold">Qty: {item.quantity}</span>
                  <button 
                    onClick={() => dispatch({ type: 'REMOVE_FROM_CART', payload: item.id })}
                    class="text-rose-600 text-sm font-semibold hover:underline"
                  >
                    Remove
                  </button>
                </div>
              </div>
            ))}
          </div>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
            <span class="text-lg font-bold">Total Amount:</span>
            <span class="text-2xl font-extrabold text-indigo-600">${total.toFixed(2)}</span>
          </div>
          <button 
            onClick={() => { alert('Order placed successfully!'); dispatch({ type: 'CLEAR_CART' }); }}
            class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition"
          >
            Checkout Now
          </button>
        </div>
      );
    };

    // --- 4. MAIN APP CONTAINER (Routing Router Simulation) ---
    const App = () => {
      const [currentPath, setCurrentPath] = useState('/');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const { products, setProducts, loading, error } = useFetchProducts();
      const [cart, dispatch] = useReducer(cartReducer, { items: [] });

      const cartCount = cart.items.reduce((sum, item) => sum + item.quantity, 0);

      const renderView = () => {
        switch (currentPath) {
          case '/':
            return <HomePage navigate={setCurrentPath} />;
          case '/products':
            return (
              <ProductsPage 
                products={products} 
                loading={loading} 
                error={error} 
                addToCart={(p) => dispatch({ type: 'ADD_TO_CART', payload: p })}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
              />
            );
          case '/admin':
            return <AdminDashboard products={products} setProducts={setProducts} />;
          case '/contact':
            return <ContactPage />;
          case '/profile':
            return <ProfilePage />;
          case '/cart':
            return <CartPage cart={cart} dispatch={dispatch} navigate={setCurrentPath} />;
          default:
            return <HomePage navigate={setCurrentPath} />;
        }
      };

      return (
        <CartContext.Provider value={{ cart, dispatch }}>
          <div class="min-h-screen flex flex-col">
            <Navbar currentPath={currentPath} navigate={setCurrentPath} cartCount={cartCount} />
            <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
              {renderView()}
            </main>
            <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm border-t border-slate-800">
              © 2026 ShopSphere | React Training Final Assignment Project
            </footer>
          </div>
        </CartContext.Provider>
      );
    };

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
